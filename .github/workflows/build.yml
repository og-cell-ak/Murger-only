name: Build Murger Only APK
on:
 push:
  branches: [main]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - name: Install Android SDK
     run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
   - name: Code verification pass 1
     run: python3 tools/verify_project.py
   - name: Code verification pass 2
     run: python3 tools/verify_project.py
   - name: Generate Gradle wrapper
     run: gradle wrapper --gradle-version 8.10.2
   - name: Build release APK
     run: ./gradlew assembleRelease
   - name: APK integrity verification
     run: APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit); test -n "$APK"; unzip -tq "$APK"
   - uses: actions/upload-artifact@v4
     with: {name: murger-only-final, path: app/build/outputs/apk/release/*.apk}