name: Build Murger Only APK
on:
 push:
  branches: [main]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - name: Install Android SDK
     run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
   - name: Code verification pass 1
     run: python3 tools/verify_project.py
   - name: Code verification pass 2
     run: python3 tools/verify_project.py
   - name: Generate Gradle wrapper
     run: gradle wrapper --gradle-version 8.10.2
   - name: Build release APK
     run: ./gradlew assembleRelease
   - name: Sign installable APK
     run: |
      APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit)
      test -n "$APK"
      keytool -genkeypair -v -keystore "$RUNNER_TEMP/murger-debug.jks" -alias murger -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Murger Only"
      "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
      "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/murger-debug.jks" --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/Murger-Only-Final.apk "$RUNNER_TEMP/aligned.apk"
   - name: APK integrity verification
     run: |
      unzip -tq app/build/outputs/apk/release/Murger-Only-Final.apk
      "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/Murger-Only-Final.apk
   - uses: actions/upload-artifact@v4
     with: {name: murger-only-final, path: app/build/outputs/apk/release/Murger-Only-Final.apk}