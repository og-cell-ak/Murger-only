name: Build Murger Only APK
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
   - name: Install Android SDK
     run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
   - name: Code verification pass 1
     run: python3 tools/verify_project.py
   - name: Code verification pass 2
     run: python3 tools/verify_project.py
   - name: Generate Gradle wrapper
     run: gradle wrapper --gradle-version 8.10.2
   - name: Build release APK
     run: ./gradlew assembleRelease
   - name: APK integrity verification
     run: unzip -tq app/build/outputs/apk/release/app-release.apk
   - uses: actions/upload-artifact@v4
     with: {name: murger-only-final, path: app/build/outputs/apk/release/app-release.apk}
